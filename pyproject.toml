[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsupport"
version = "0.1.0"
description = "Diagnostics for evaluation-support instability in spatial crop classification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "The authors"}]
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
